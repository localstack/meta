# Ensures all the relevant groups of labels are applied to a PR.
name: Enforce All PR Labels

on:
  workflow_call:
    inputs:
      docs:
        required: false
        description: Whether to enforce the `docs` label group.
        type: boolean
        default: true
      notes:
        required: false
        description: Whether to enforce the `notes` label group.
        type: boolean
        default: true
    secrets:
      github-token:
        required: true
        description: A GitHub personal access token with write access to the project

jobs:
  docs:
    if: ${{ inputs.docs }}
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        with:
          mode: exactly
          count: 1
          labels: "docs: needed, docs: skip"
          token: ${{ secrets.github-token }}
  notes:
    if: ${{ inputs.notes }}
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5
        with:
          mode: exactly
          count: 1
          labels: "notes: needed, notes: skip"
          token: ${{ secrets.github-token }}